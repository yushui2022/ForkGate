<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">ForkGate</title>
  <desc id="desc">Connected branch paths pass through a single controlled egress.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c172b"/>
      <stop offset="1" stop-color="#16253e"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52c7f4"/>
      <stop offset="1" stop-color="#8fa2ff"/>
    </linearGradient>
    <linearGradient id="egress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb4f7"/>
      <stop offset="1" stop-color="#f4c8f4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="750" height="210" rx="38" fill="url(#panel)" stroke="#30476b" stroke-width="2"/>

  <!-- One connected route: source node -> fork diamond -> controlled egress. -->
  <g transform="translate(25 30)">
    <rect width="178" height="160" rx="31" fill="#101e35" stroke="#30476b" stroke-width="2"/>

    <g fill="none" stroke="url(#route)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M28 80 H72"/>
      <path d="M72 80 L108 43 L144 80 L108 117 Z"/>
      <path d="M144 80 H163"/>
    </g>

    <g fill="#dff8ff" stroke="#44c5f2" stroke-width="4">
      <circle cx="28" cy="80" r="10"/>
      <circle cx="108" cy="43" r="10"/>
      <circle cx="108" cy="117" r="10"/>
    </g>

    <g fill="none" stroke="url(#egress)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M163 80 H184"/>
      <path d="m176 71 10 9-10 9"/>
    </g>
  </g>

  <text x="246" y="113" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">
    <tspan>Fork</tspan><tspan fill="#70ddf5">Gate</tspan>
  </text>
  <text x="251" y="151" fill="#9aabc3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="4">BRANCH-AWARE EGRESS</text>
  <circle cx="706" cy="151" r="4" fill="#70ddf5"/>
</svg>
