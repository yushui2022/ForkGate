<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">ForkGate</title>
  <desc id="desc">A branching execution path passing through a controlled network gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="200" rx="32" fill="#f8fafc"/>
  <rect x="12" y="12" width="176" height="176" rx="28" fill="url(#bg)"/>

  <g fill="none" stroke="url(#branch)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 100 H68" stroke-width="10"/>
    <path d="M68 100 L103 62 M68 100 L103 138" stroke-width="10"/>
    <path d="M103 62 L125 100 M103 138 L125 100" stroke-width="10"/>
    <path d="M125 100 H145" stroke-width="10"/>
  </g>

  <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="5">
    <circle cx="38" cy="100" r="11"/>
    <circle cx="103" cy="62" r="11"/>
    <circle cx="103" cy="138" r="11"/>
  </g>

  <g fill="none" stroke="url(#gate)" stroke-width="9" stroke-linecap="round">
    <path d="M145 52 V148"/>
    <path d="M165 52 V148"/>
  </g>
  <path d="M145 100 H174" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  <path d="m166 91 10 9-10 9" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="220" y="116" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-3">ForkGate</text>
  <text x="224" y="151" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="3">BRANCH-AWARE EGRESS</text>
</svg>
